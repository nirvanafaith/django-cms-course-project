{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="浏览和查询校园栏目与已发布文章。">
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <title>{% block title %}{{ page_title }} · CMS 原型系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/tokens.css' %}" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="cms-body">
    {% include "partials/nav.html" %}
    <main id="main-content" class="site-main container">
        {% include "partials/messages.html" %}
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">
            <small>基于 Python/Django 的 CMS 原型系统 · CITEL_T_001 课程作业</small>
        </div>
    </footer>
    <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
