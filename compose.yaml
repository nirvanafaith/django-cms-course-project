name: cms-course

x-app-environment: &app-environment
  DJANGO_MODE: local
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
  CSRF_TRUSTED_ORIGINS: http://127.0.0.1:${APP_PORT:-8000},http://localhost:${APP_PORT:-8000}
  POSTGRES_DB: ${POSTGRES_DB:-cms}
  POSTGRES_USER: ${POSTGRES_USER:-cms_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in .env}
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
  REDIS_URL: redis://redis:6379/0
  CMS_LOG_DIR: /app/logs
  COVERAGE_FILE: /tmp/.coverage
  TZ: Asia/Shanghai
  WAITRESS_HOST: 0.0.0.0
  WAITRESS_PORT: "8000"
  WAITRESS_THREADS: "8"
  TRUST_PROXY_HEADERS: "0"
  WAITRESS_TRUSTED_PROXY: 127.0.0.1

x-app-service: &app-service
  build:
    context: ./cms_site
  environment: *app-environment

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  migrate:
    <<: *app-service
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py verify_postgres && python manage.py seed_data && python manage.py collectstatic --noinput
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    volumes:
      - app-logs:/app/logs
    logging: *default-logging

  test:
    <<: *app-service
    environment:
      <<: *app-environment
      CMS_PROJECT_ROOT: /workspace
    command:
      - /bin/sh
      - -c
      - coverage run manage.py test --exclude-tag=postgres_performance && coverage report --fail-under=80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    volumes:
      - .:/workspace:ro
    logging: *default-logging

  web:
    <<: *app-service
    restart: unless-stopped
    ports:
      - 127.0.0.1:${APP_PORT:-8000}:8000
    volumes:
      - app-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

volumes:
  postgres-data:
  app-logs:
