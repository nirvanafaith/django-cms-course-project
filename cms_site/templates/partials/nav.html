{% with url_name=request.resolver_match.url_name %}
<a class="skip-link" href="#main-content">跳到主要内容</a>
<header class="site-header">
    <nav class="site-nav container" aria-label="主导航">
        <a class="site-brand" href="{% url 'content:index' %}">CMS 内容门户</a>
        <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false"
                aria-controls="site-nav-menu" aria-label="展开菜单">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <ul class="nav-menu" id="site-nav-menu" data-nav-menu>
            <li><a href="{% url 'content:index' %}" {% if url_name == 'index' %}aria-current="page"{% endif %}>首页</a></li>
            <li><a href="{% url 'content:item_list' %}" {% if url_name == 'item_list' or url_name == 'item_detail' %}aria-current="page"{% endif %}>全部文章</a></li>
            <li><a href="{% url 'content:search' %}" {% if url_name == 'search' %}aria-current="page"{% endif %}>搜索</a></li>
            {% if user.is_staff %}<li><a href="/admin/">后台管理</a></li>{% endif %}
        </ul>
    </nav>
</header>
{% endwith %}
