{% extends "base.html" %}

{% block content %}
<section class="content-section login-section" aria-labelledby="login-title">
    <div class="section-heading">
        <div>
            <p class="eyebrow">用户登录</p>
            <h1 id="login-title">登录 CMS 内容门户</h1>
        </div>
    </div>
    {% if form.non_field_errors %}
    <div class="message message-error" role="alert">{{ form.non_field_errors }}</div>
    {% endif %}
    <form method="post" class="search-form">
        {% csrf_token %}
        <div class="field-group">
            <label for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
            {{ form.username }}
            {{ form.username.errors }}
        </div>
        <div class="field-group">
            <label for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
            {{ form.password }}
            {{ form.password.errors }}
        </div>
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="button button-primary" type="submit">登录</button>
    </form>
</section>
{% endblock %}
