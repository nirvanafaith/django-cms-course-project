{% load static %}
<!doctype html>
<html lang="zh-hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{% block title %}请求未完成{% endblock %} · 北京交通大学</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link href="{% static 'css/tokens.css' %}" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="cms-body">
    <main class="error-page container" id="main-content">
        <section class="error-panel" role="alert" aria-labelledby="error-title">
            <p class="eyebrow">内容门户</p>
            <h1 id="error-title">{% block heading %}请求未完成{% endblock %}</h1>
            <p>{% block message %}请稍后重试。{% endblock %}</p>
            <a class="button button-primary" href="/">返回首页</a>
        </section>
    </main>
</body>
</html>
