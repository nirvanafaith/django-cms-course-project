<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title }} · CMS 原型系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'content:index' %}">CMS 原型系统</a>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'content:index' %}">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'content:item_list' %}">全部文章</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'content:search' %}">搜索</a></li>
                {% if user.is_staff %}
                <li class="nav-item"><a class="nav-link" href="/admin/">后台管理</a></li>
                {% endif %}
            </ul>
            <form class="d-flex" action="{% url 'content:search' %}" method="get">
                <input class="form-control me-2" type="text" name="q" placeholder="按题目搜索…"
                       value="{{ form.q.value|default:'' }}">
                <button class="btn btn-outline-light" type="submit">搜索</button>
            </form>
        </div>
    </div>
</nav>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="text-center text-muted py-4 mt-5">
    <small>基于 Python/Django 的 CMS 原型系统 · CITEL_T_001 课程作业</small>
</footer>
</body>
</html>
